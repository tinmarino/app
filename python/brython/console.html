<!doctype html>
<html>
<head>
    <title>Brython interactive mode</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <noscript>Please enable Javascript to view this page correctly.</noscript>

    <!-- Brython 3.14.3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/brython@3.14.3/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.14.3/brython_stdlib.js"></script>

    <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #002b36; }
    .codearea {
        background-color: #002b36;
        color: #93a1a1;
        font-family: 'Fira Code', 'Consolas', 'Liberation Mono', monospace;
        font-size: 14px;
        overflow: auto;
    }
    div, textarea {
        height: 100%;
        width: 100%;
        margin: 0;
        border-width: 0;
        outline: none;
        resize: none;
    }
    </style>
</head>

<body onload="brython({debug:1, indexedDB: false})">
    <textarea id="code" class="codearea" spellcheck="false"></textarea>

    <script type="text/python">
import sys
import traceback as tb

from browser import document as doc, window

CODE_ELT = doc['code']

history = []
current = 0
_status = "main"

editor_ns = {'__name__': '__main__'}

OUT_BUFFER = ''

def write(data):
    global OUT_BUFFER
    OUT_BUFFER += str(data)

def flush():
    global CODE_ELT, OUT_BUFFER
    CODE_ELT.value += OUT_BUFFER
    OUT_BUFFER = ''

sys.stdout.write = sys.stderr.write = write
sys.stdout.__len__ = sys.stderr.__len__ = lambda: len(OUT_BUFFER)

def cursorToEnd(*args):
    pos = len(CODE_ELT.value)
    CODE_ELT.setSelectionRange(pos, pos)
    CODE_ELT.scrollTop = CODE_ELT.scrollHeight

def get_col(area):
    sel = CODE_ELT.selectionStart
    lines = CODE_ELT.value.split('\n')
    for line in lines[:-1]:
        sel -= len(line) + 1
    return sel

def print_tb():
    import io
    buf = io.StringIO()
    tb.print_exc(file=buf)
    CODE_ELT.value += buf.getvalue()

def myKeyPress(event):
    global _status, current
    if event.keyCode == 9:  # tab
        event.preventDefault()
        CODE_ELT.value += "    "
    elif event.keyCode == 13:  # return
        src = CODE_ELT.value
        if _status == "main":
            currentLine = src[src.rfind('>>>') + 4:]
        elif _status == "3string":
            currentLine = src[src.rfind('>>>') + 4:]
            currentLine = currentLine.replace('\n... ', '\n')
        else:
            currentLine = src[src.rfind('...') + 4:]
        if _status == 'main' and not currentLine.strip():
            CODE_ELT.value += '\n>>> '
            event.preventDefault()
            return
        CODE_ELT.value += '\n'
        history.append(currentLine)
        current = len(history)
        if _status == "main" or _status == "3string":
            try:
                _ = editor_ns['_'] = eval(currentLine, editor_ns)
                flush()
                if _ is not None:
                    write(repr(_) + '\n')
                flush()
                CODE_ELT.value += '>>> '
                _status = "main"
            except IndentationError:
                CODE_ELT.value += '... '
                _status = "block"
            except SyntaxError as msg:
                if str(msg) == 'invalid syntax : triple string end not found' or \
                    str(msg).startswith('Unbalanced bracket'):
                    CODE_ELT.value += '... '
                    _status = "3string"
                elif str(msg) == 'eval() argument must be an expression':
                    try:
                        exec(currentLine, editor_ns)
                    except:
                        print_tb()
                    flush()
                    CODE_ELT.value += '>>> '
                    _status = "main"
                elif str(msg) == 'decorator expects function':
                    CODE_ELT.value += '... '
                    _status = "block"
                else:
                    print_tb()
                    CODE_ELT.value += '>>> '
                    _status = "main"
            except:
                print_tb()
                CODE_ELT.value += '>>> '
                _status = "main"
        elif currentLine == "":
            block = src[src.rfind('>>>') + 4:].splitlines()
            block = [block[0]] + [b[4:] for b in block[1:]]
            block_src = '\n'.join(block)
            _status = "main"
            try:
                exec(block_src, editor_ns)
            except:
                print_tb()
            flush()
            CODE_ELT.value += '>>> '
        else:
            CODE_ELT.value += '... '

        cursorToEnd()
        event.preventDefault()

def myKeyDown(event):
    global _status, current
    if event.keyCode == 37:  # left
        sel = get_col(CODE_ELT)
        if sel < 5:
            event.preventDefault()
            event.stopPropagation()
    elif event.keyCode == 36:  # home
        pos = CODE_ELT.selectionStart
        col = get_col(CODE_ELT)
        CODE_ELT.setSelectionRange(pos - col + 4, pos - col + 4)
        event.preventDefault()
    elif event.keyCode == 38:  # up
        if current > 0:
            pos = CODE_ELT.selectionStart
            col = get_col(CODE_ELT)
            CODE_ELT.value = CODE_ELT.value[:pos - col + 4]
            current -= 1
            CODE_ELT.value += history[current]
        event.preventDefault()
    elif event.keyCode == 40:  # down
        if current < len(history) - 1:
            pos = CODE_ELT.selectionStart
            col = get_col(CODE_ELT)
            CODE_ELT.value = CODE_ELT.value[:pos - col + 4]
            current += 1
            CODE_ELT.value += history[current]
        event.preventDefault()
    elif event.keyCode == 8:  # backspace
        src = CODE_ELT.value
        lstart = src.rfind('\n')
        if (lstart == -1 and len(src) < 5) or (len(src) - lstart < 6):
            event.preventDefault()
            event.stopPropagation()
    elif event.ctrlKey and event.keyCode == 65:  # ctrl+a
        src = CODE_ELT.value
        pos = CODE_ELT.selectionStart
        col = get_col(CODE_ELT)
        CODE_ELT.setSelectionRange(pos - col + 4, len(src))
        event.preventDefault()
    elif event.keyCode in [33, 34]:  # page up/down
        event.preventDefault()

CODE_ELT.bind('keypress', myKeyPress)
CODE_ELT.bind('keydown', myKeyDown)
CODE_ELT.bind('click', cursorToEnd)

v = sys.implementation.version
CODE_ELT.value = f"Brython {v[0]}.{v[1]}.{v[2]} on {window.navigator.appName} {window.navigator.appVersion}\n>>> "
CODE_ELT.focus()
cursorToEnd()
    </script>

</body>
</html>
