<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pyodide Console (v314)</title>
    <!-- jQuery Terminal for a proper REPL experience -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal@2/js/jquery.terminal.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/jquery.terminal@2/css/jquery.terminal.min.css" rel="stylesheet">
    <!-- Modern Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; background: #002b36; }
      .terminal { font-size: 14px; }
    </style>
  </head>
  <body>
    <script>
      async function main() {
        const pyodide = await loadPyodide();
        await pyodide.loadPackage('pyodide-http');

        // Set up the interactive console using pyodide.console
        const pyconsole = pyodide.runPython(`
          import pyodide.console
          pyodide.console.PyodideConsole(globals())
        `);

        const term = $('body').terminal(
          async function (command) {
            // Push returns a future; await it
            const fut = pyconsole.push(command);
            const syntax_check = fut.syntax_check;

            switch (syntax_check) {
              case 'syntax-error':
                term.error(fut.formatted_error);
                break;
              case 'incomplete':
                term.set_prompt('... ');
                return;
              case 'complete':
                try {
                  const repr_shorten = pyodide.globals.get('__builtins__').__import__('pyodide._core').repr_shorten;
                  // Await the future result
                  const result = await fut;
                  if (result !== undefined && result !== null) {
                    const text = repr_shorten.callKwargs(result, { separator: '\n' });
                    if (text && text !== 'None') {
                      term.echo(text);
                    }
                  }
                } catch (e) {
                  if (e.constructor.name === 'PythonError') {
                    term.error(fut.formatted_error);
                  } else {
                    throw e;
                  }
                }
                break;
            }
            term.set_prompt('>>> ');
          },
          {
            greetings: `Welcome to Pyodide ${pyodide.version} (CPython ${pyodide.runPython('import sys; sys.version.split()[0]')})`,
            prompt: '>>> ',
            completionEscape: false,
            completion: function (command, callback) {
              callback(pyconsole.complete(command).toJs()[0]);
            },
          }
        );

        // Redirect stdout/stderr to terminal
        pyodide.setStdout({ batched: (s) => term.echo(s) });
        pyodide.setStderr({ batched: (s) => term.error(s) });

        window.term = term;
        window.pyodide = pyodide;
      }
      main();
    </script>
  </body>
</html>
