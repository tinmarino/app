<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + the safe-area padding in the CSS keep the prompt clear
     of the iPhone home indicator; interactive-widget resizes the layout instead
     of scrolling it when the on-screen keyboard appears. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d2021">
<meta name="description" content="Interactive Python 3 console running entirely in your browser, powered by Pyodide. No server, no install.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>IPyodide — Python in your browser</title>

<link rel="stylesheet" href="/css/lib_color_dark_gruvbox.css">
<link rel="stylesheet" href="/css/lib_color_use_custom_var.css">
<link rel="stylesheet" href="/css/prism_dark_dark.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>

<!--
  One pane, one focus. This is the whole terminal: the scrollback and the
  prompt live in the same scrolling flow, the way a real console does, so
  there is no second element to tab into and nothing to click between.

  Everything that used to be a button is a magic instead: !help, %clear,
  %stop, %exercises. Ctrl+C restarts a wedged runtime.
-->
<div id="terminal" role="log" aria-live="polite" aria-label="Python console">
  <div id="output"></div>
  <div id="prompt-line">
    <label for="input" id="prompt">&gt;&gt;&gt;</label>
    <!-- A textarea, not an input: multi-line blocks must be editable. It is
         styled to disappear into the flow, so the caret looks like a terminal
         caret sitting after the prompt. -->
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
              autocapitalize="off" autocorrect="off" enterkeyhint="send"
              aria-label="Python input"></textarea>
  </div>
</div>

<!-- Touch-only key row: the characters Python needs most and a phone keyboard
     buries three taps deep. Hidden on anything with a real keyboard. -->
<div id="keyrow" aria-label="Extra keys">
  <button type="button" tabindex="-1" data-ins="    " title="Indent">tab</button>
  <button type="button" tabindex="-1" data-ins="(">(</button>
  <button type="button" tabindex="-1" data-ins=")">)</button>
  <button type="button" tabindex="-1" data-ins="[">[</button>
  <button type="button" tabindex="-1" data-ins="]">]</button>
  <button type="button" tabindex="-1" data-ins="{">{</button>
  <button type="button" tabindex="-1" data-ins="}">}</button>
  <button type="button" tabindex="-1" data-ins=":">:</button>
  <button type="button" tabindex="-1" data-ins="'">'</button>
  <button type="button" tabindex="-1" data-ins="&quot;">"</button>
  <button type="button" tabindex="-1" data-ins="=">=</button>
  <button type="button" tabindex="-1" data-ins="_">_</button>
  <button type="button" tabindex="-1" data-ins="%">%</button>
  <button type="button" tabindex="-1" data-act="up" title="Previous command">&#8593;</button>
  <button type="button" tabindex="-1" data-act="down" title="Next command">&#8595;</button>
  <button type="button" tabindex="-1" data-act="newline" title="New line">&crarr;</button>
</div>

<script src="/js/tin-prism-dark.js"></script>
<script src="pyutil.js"></script>
<script src="worker-manager.js"></script>
<script src="shell.js"></script>

</body>
</html>
