<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Exercises - Tinmarino Classroom</title>

<!-- Gruvbox theme variables (same as main site) -->
<link rel="stylesheet" href="/css/lib_color_dark_gruvbox.css">
<link rel="stylesheet" href="/css/lib_color_use_custom_var.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Left sidebar: exercise list -->
<aside id="sidebar">
  <h2 id="sidebar-title">Python Exercises</h2>
  <ul id="exercise-list"></ul>
  <div id="sidebar-footer">
    <button id="btn-login" title="Login / configure AWS credentials">Login</button>
    <button id="btn-push" title="Push progress to AWS S3" disabled>Push</button>
  </div>
</aside>

<!-- Main area -->
<main id="main">

  <!-- Top toolbar -->
  <div id="toolbar">
    <span id="exercise-title">Select an exercise</span>
    <div id="toolbar-buttons">
      <button id="btn-run" title="Run code (Ctrl+Enter)">Run</button>
      <button id="btn-check" title="Check against tests">Check</button>
      <button id="btn-reset" title="Reset to template">Reset</button>
      <button id="btn-console" title="Toggle interactive console">Console</button>
    </div>
  </div>

  <!-- Editor area -->
  <div id="editor-container">
    <textarea id="editor" spellcheck="false" placeholder="# Select an exercise from the left panel"></textarea>
  </div>

  <!-- Output area with tabs -->
  <div id="output-area">
    <div id="output-tabs">
      <button class="tab active" data-tab="output">Output</button>
      <button class="tab" data-tab="tests">Tests</button>
      <button class="tab" data-tab="console">Console</button>
    </div>
    <div id="output-pane" class="tab-content active">
      <pre id="output"></pre>
    </div>
    <div id="tests-pane" class="tab-content">
      <pre id="tests-output"></pre>
    </div>
    <div id="console-pane" class="tab-content">
      <div id="console-history"></div>
      <div id="console-input-line">
        <span class="prompt">&gt;&gt;&gt; </span>
        <input id="console-input" type="text" spellcheck="false" autocomplete="off" placeholder="Type Python here...">
      </div>
    </div>
  </div>

</main>

<!-- Login modal -->
<div id="login-modal" class="modal hidden">
  <div class="modal-content">
    <h3>AWS Credentials</h3>
    <p>Enter credentials to sync your progress to S3.</p>
    <label>Username<input id="login-user" type="text" autocomplete="username"></label>
    <label>Password<input id="login-pass" type="password" autocomplete="current-password"></label>
    <div class="modal-buttons">
      <button id="login-ok">Login</button>
      <button id="login-cancel">Cancel</button>
    </div>
    <p id="login-error" class="error"></p>
  </div>
</div>

<!-- Load Pyodide from vendored copy -->
<script src="vendor/pyodide/314.0.6/pyodide/pyodide.js"></script>

<!-- App scripts -->
<script src="worker-manager.js"></script>
<script src="app.js"></script>

</body>
</html>
